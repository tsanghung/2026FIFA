name: 🚀 Deploy Static Site to GitHub Pages

# Builds docs/ and publishes to GitHub Pages. `configure-pages` with
# enablement:true turns Pages on automatically using the workflow's own token,
# so no manual Settings toggle is needed (assuming the repo allows it).
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'build_static.py'
      - 'site_config.py'
      - 'affiliate_config.py'
      - 'display_utils.py'
      - 'fifa_2026.db'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  # Re-deploy right after the daily data sync finishes.
  workflow_run:
    workflows: ["🏆 2026 FIFA Daily Data Sync"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build static site
        run: python build_static.py
      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
