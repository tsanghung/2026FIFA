name: 🔎 Probe Data Sources (FBref / Sofascore / FotMob / 365Scores)

# 探測資料源。第二版聚焦 365Scores(唯一連得到的):抓一場已完賽比賽的詳情,
# 遞迴找出 xG / 球員評分 / 陣容 / 統計 等欄位的實際路徑與樣本,決定值不值得接。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 📦 Install deps
        run: pip install --quiet requests
      - name: 🔎 Deep-probe 365Scores
        run: |
          python - <<'PY'
          import requests, json, re
          UA = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 '
                              '(KHTML, like Gecko) Chrome/124.0 Safari/537.36',
                'Accept': 'application/json, text/html, */*'}
          BASE = 'https://webws.365scores.com/web'
          COMMON = 'appTypeId=5&langId=1&timezoneName=Asia/Taipei&userCountryId=1'

          def get(url):
              r = requests.get(url, headers=UA, timeout=25)
              return r.status_code, r.text

          # 1) current games -> collect competitions + a finished football gameId
          sc, txt = get(f'{BASE}/games/current/?{COMMON}&sports=1')
          print(f'PROBE games/current -> {sc} len={len(txt)}')
          data = json.loads(txt)
          games = data.get('games', [])
          comps = {}
          finished = []
          wc_finished = []
          for g in games:
              comp = g.get('competitionDisplayName') or g.get('competitionName') or str(g.get('competitionId'))
              comps[comp] = comps.get(comp, 0) + 1
              # status: look for finished-ish
              st = json.dumps(g.get('statusText','')) + json.dumps(g.get('gameStatus',''))
              gid = g.get('id')
              if g.get('statusGroup') in (3, 4) or 'End' in str(g.get('statusText','')) or g.get('gameStatusScore') is not None:
                  if gid: finished.append(gid)
                  if 'World Cup' in comp or '世界' in comp:
                      wc_finished.append(gid)
          print('PROBE competitions in feed:', json.dumps(comps, ensure_ascii=False)[:600])
          print('PROBE finished gameIds sample:', finished[:8])
          print('PROBE WC finished gameIds:', wc_finished[:8])

          # 2) pick a gameId to inspect (prefer WC, else any finished, else first game)
          gid = (wc_finished or finished or [games[0]['id'] if games else None])[0]
          print('PROBE inspecting gameId:', gid)
          if gid:
              for shape in [f'{BASE}/game/?{COMMON}&gameId={gid}',
                            f'{BASE}/game/stats/?{COMMON}&games={gid}']:
                  sc, txt = get(shape)
                  print(f'PROBE detail {shape.split("?")[0]} -> {sc} len={len(txt)}')
                  if sc != 200:
                      print('   sample:', txt[:160]); continue
                  try:
                      gd = json.loads(txt)
                  except Exception as e:
                      print('   not json:', e); continue
                  # recursively find interesting keys
                  hits = {}
                  KEYS = ('xg','expectedgoal','rating','lineup','statistic','chart','shot','possession','formation','player')
                  def walk(o, path=''):
                      if isinstance(o, dict):
                          for k,v in o.items():
                              lk = k.lower()
                              if any(t in lk for t in KEYS):
                                  s = json.dumps(v, ensure_ascii=False)
                                  hits.setdefault(k, f'{path}/{k} = {s[:140]}')
                              walk(v, f'{path}/{k}')
                      elif isinstance(o, list):
                          for i,v in enumerate(o[:3]):
                              walk(v, f'{path}[{i}]')
                  walk(gd)
                  print(f'   FOUND {len(hits)} interesting keys:')
                  for k,sample in list(hits.items())[:25]:
                      print('    -', sample)
          print('PROBE DONE')
          PY
