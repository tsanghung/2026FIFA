name: 🔎 Probe 365Scores xG (dry-run)

# Verification harness for threefivescores_sync.py. Runs the real 365Scores fetch +
# fixture matching + xG-diff blend, but with --dry-run so it writes NOTHING to the DB.
# The log shows exactly which finished WC games were found, the per-team xG it parsed,
# which fixtures they matched, and what the model feature (fbref_xg_diff) WOULD become.
# Once verified, the same script is wired into daily_sync.yml (without --dry-run).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Checkout Repository
        uses: actions/checkout@v4
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 📦 Install deps
        run: pip install --quiet requests beautifulsoup4
      - name: 🔎 365Scores xG dry-run (no DB writes)
        run: python threefivescores_sync.py --dry-run
