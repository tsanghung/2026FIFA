name: 🏆 2026 FIFA Daily Data Sync

on:
  schedule:
    # 365Scores gives near-real-time scores; a frequent sync keeps the site fresh.
    # Cloudflare Pages free tier allows ~500 builds/month, so run every 2 hours
    # (~360/month) rather than hourly (~720) to stay comfortably under the cap.
    - cron: '0 */2 * * *'  # every 2 hours: live scores + rebuild + deploy
    # Keep the 07:00 UTC (15:00 Taiwan) schedule string too — the daily calibration
    # step below is gated to it, so this guarantees one calibration run per day.
    - cron: '0 7 * * *'    # 15:00 Taiwan: daily calibration trigger
  push:
    # Any push to main also refreshes data immediately. The sync's own commit is
    # pushed with GITHUB_TOKEN, which by design does NOT trigger another workflow
    # run, so there is no loop — and the job-level guard below is a second safety
    # net. We deliberately do NOT put any [skip ...] token in the commit message,
    # because Cloudflare Pages treats those as "skip build" and was freezing the
    # live site by skipping every main deployment.
    branches: [main]
  workflow_dispatch: # Allows manual execution from GitHub actions tab

# Never let two syncs run at once (they both commit to main and would race).
concurrency:
  group: daily-sync
  cancel-in-progress: false

permissions:
  contents: write # Crucial permission to allow push back to repository

jobs:
  sync:
    # Loop guard: never react to the bot's own data-sync commit (Cloudflare still
    # deploys it because there is no skip token in the message).
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 🔍 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: ⚡ Run Quantitative Sync & Prediction Engine
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          python sync_fifa.py

      - name: ⚽ Sync live/final scores (365Scores)
        # Wikipedia lags hours behind on final scores; 365Scores publishes them
        # sooner. Fill in FINAL scores fast so ended matches stop showing "VS".
        # MUST run after sync_fifa (which rebuilds matches from Wikipedia each run).
        # Live games are left untouched. Non-fatal: a source hiccup must not fail
        # the sync.
        continue-on-error: true
        run: |
          python livescore_sync.py

      - name: 📊 Sync 365Scores xG & blend into model
        # Pull post-match xG/possession/shots for finished World Cup games, store
        # them for display, blend each team's live xG-diff into fbref_xg_diff, then
        # recompute predictions. Non-fatal: a source hiccup must not fail the sync.
        continue-on-error: true
        run: |
          python threefivescores_sync.py

      - name: 🎯 Daily Calibration Regression & Rolling Adjustment (15:00 Taiwan)
        # 校正回歸 + 滾動式調整: re-fit the prediction parameters against the full
        # international-results history (RPS coordinate descent) and refresh the
        # data-driven Elo seeds, then regenerate predictions in a FRESH process so
        # they adopt the freshly calibrated params/seeds. Gated to the 07:00 UTC
        # trigger (15:00 Taiwan) and manual runs so it recalibrates once per day,
        # not on every sync. Non-fatal so a calibration hiccup never breaks the sync.
        if: github.event.schedule == '0 7 * * *' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          python backtest.py
          python -c "import sync_fifa; sync_fifa.reset_and_recalculate_all_elo_and_predictions()"

      - name: Sync External Prediction Sources
        run: |
          python external_predictions.py

      - name: 🎟️ Settle Personal Bets & Refresh Win-Rate Report
        run: |
          python bet_tracker.py

      - name: 📡 Evaluate Live Prediction Accuracy
        run: |
          python prediction_eval.py

      - name: 🏗️ Build Static Site (for Cloudflare Pages)
        env:
          # Set the SITE_URL repo Variable to the production URL
          # (e.g. https://sfiimfoan.simonsynapse.net). Falls back to default if unset.
          SITE_URL: ${{ vars.SITE_URL }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
        run: |
          python build_static.py

      - name: 🗄️ Push data to Supabase (no-op if secrets unset)
        # Backend on Supabase: idempotent upsert of every table. Self-guards when the
        # secrets are absent, so it is harmless until Supabase is configured.
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python supabase_sync.py

      - name: 💾 Git Commit and Push Updates
        env:
          CF_DEPLOY_HOOK_URL: ${{ secrets.CF_DEPLOY_HOOK_URL }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Check if there are changes to commit
          if [ -n "$(git status --porcelain)" ]; then
            git add fifa_2026.db sync.log CHAMPION_TREND.md BET_TRACKING.md PRED_ACCURACY.md prediction_metrics_live.json docs
            # Persist daily-calibration outputs so tuned params/seeds survive the
            # ephemeral runner (no-op on runs where calibration didn't execute).
            git add calibrated_params.json backtest_metrics.json team_ratings_seed.json 2>/dev/null || true
            git commit -m "chore: daily data, odds sync & static site rebuild"
            git push origin HEAD:${{ github.ref }}
            # Cloudflare's Git auto-deploy is unreliable for this project, so trigger
            # a Pages deployment explicitly via a Deploy Hook — but only when there
            # were real changes, to stay under the free build cap. No-op until the
            # CF_DEPLOY_HOOK_URL secret is set.
            if [ -n "${CF_DEPLOY_HOOK_URL}" ]; then
              curl -s -X POST "${CF_DEPLOY_HOOK_URL}" -o /dev/null -w "Cloudflare deploy hook -> HTTP %{http_code}\n"
            else
              echo "CF_DEPLOY_HOOK_URL not set; relying on Cloudflare Git auto-deploy."
            fi
          else
            echo "No database or log changes to commit."
          fi
