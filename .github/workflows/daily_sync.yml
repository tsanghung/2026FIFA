name: 🏆 2026 FIFA Daily Data Sync

on:
  schedule:
    # Runs at 04:00 UTC (12:00 PM Taiwan Time) daily
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual execution from GitHub actions tab

permissions:
  contents: write # Crucial permission to allow push back to repository

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 🔍 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: ⚡ Run Quantitative Sync & Prediction Engine
        run: |
          python sync_fifa.py

      - name: 💾 Git Commit and Push Updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Check if there are changes to commit
          if [ -n "$(git status --porcelain)" ]; then
            git add fifa_2026.db sync.log
            git commit -m "chore: daily data and odds sync [skip ci]"
            git push origin feature/streamlit-dashboard
          else
            echo "No database or log changes to commit."
          fi
