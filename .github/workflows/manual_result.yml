name: ✍️ Manual Match Result Update

# 手動輸入一場正賽比分 → 寫入持久覆蓋檔 → 重算預測/評級 → 結算投注 →
# 即時準確度評分 → 重建靜態站 → commit。前後端資料一次同步。
on:
  workflow_dispatch:
    inputs:
      match_num:
        description: '場次編號 (1–104)'
        required: true
        type: string
      home_goals:
        description: '主隊進球數'
        required: true
        type: string
      away_goals:
        description: '客隊進球數'
        required: true
        type: string
      remove:
        description: '改為「撤銷」此場次的手動賽果 (true/false)'
        required: false
        default: 'false'
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: ✍️ Apply Manual Result & Recompute
        run: |
          if [ "${{ github.event.inputs.remove }}" = "true" ]; then
            python update_result.py --remove "${{ github.event.inputs.match_num }}"
          else
            python update_result.py "${{ github.event.inputs.match_num }}" \
              "${{ github.event.inputs.home_goals }}" "${{ github.event.inputs.away_goals }}"
          fi

      - name: 💾 Git Commit and Push Updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -n "$(git status --porcelain)" ]; then
            git add manual_results.json fifa_2026.db CHAMPION_TREND.md \
              BET_TRACKING.md PRED_ACCURACY.md prediction_metrics_live.json docs
            git commit -m "chore: manual result update for match #${{ github.event.inputs.match_num }} [skip ci]"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No changes to commit."
          fi
